<div id="grocery-add-form">
    <section class="recipe-section grocery-add-panel">
        <div class="section-heading">
            <h2 class="section-title">{{ t('grocery.section.add_groceries') }}</h2>
        </div>
        <form hx-post="{{ base_path }}/week-menu/grocery-list/add" hx-target="#grocery-list-body" hx-swap="outerHTML show:none"
            class="inline-form">
            <div class="ingredient-input item-row">
                <input type="text" id="grocery-ingredient" name="ingredient" class="form-control"
                    placeholder="{{ t('common.name') }}" aria-label="{{ t('common.name') }}" required />
                <input type="number" id="grocery-quantity" name="quantity" class="form-control" min="0.01" step="any"
                    placeholder="{{ t('common.amount') }}" aria-label="{{ t('common.amount') }}" required />
                <select id="grocery-unit" name="unit" class="form-control grocery-unit-select" required
                    aria-label="{{ t('common.unit') }}">
                    {% for unit in units %}
                    <option value="{{ unit.abbrev }}">{{ unit.abbrev }}</option>
                    {% endfor %}
                </select>
                <div class="item-row-actions">
                    <button type="submit" class="btn btn-sm icon-btn" title="{{ t('common.add') }}"
                        aria-label="{{ t('common.add') }}">➕</button>
                </div>
            </div>
        </form>
    </section>
    <hr class="content-divider">
    <section class="recipe-section grocery-add-weekly-panel">
        <form hx-post="{{ base_path }}/week-menu/grocery-list/add-weekly" hx-target="#grocery-list-body"
            hx-swap="outerHTML show:none" class="grocery-add-weekly-form">
            <button type="submit" class="btn btn-secondary btn-action">
                <span class="btn-action-icon" aria-hidden="true">📋</span>
                <span>{{ t('grocery.action.add_weekly_groceries') }}</span>
            </button>
        </form>
    </section>
    <hr class="content-divider">
</div>
