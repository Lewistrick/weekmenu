<div id="grocery-add-form">
    <section class="recipe-section grocery-add-panel">
        <div class="section-heading">
            <h2 class="section-title">{{ t('grocery.section.add_groceries') }}</h2>
        </div>
        <form hx-post="{{ base_path }}/week-menu/grocery-list/add" hx-target="#grocery-list-body" hx-swap="outerHTML show:none"
            class="form-panel grocery-add-form">
            <div class="form-group">
                <label for="grocery-ingredient">{{ t('common.name') }}</label>
                <input type="text" id="grocery-ingredient" name="ingredient" class="form-control" required />
            </div>
            <div class="form-group">
                <label for="grocery-quantity">{{ t('common.amount') }}</label>
                <input type="number" id="grocery-quantity" name="quantity" class="form-control" min="0.01" step="any" required />
            </div>
            <div class="form-group">
                <label for="grocery-unit">{{ t('common.unit') }}</label>
                <select id="grocery-unit" name="unit" class="form-control" required>
                    {% for unit in units %}
                    <option value="{{ unit.abbrev }}">{{ unit.abbrev }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-action">
                <span class="btn-action-icon" aria-hidden="true">➕</span>
                <span>{{ t('common.add') }}</span>
            </button>
        </form>
    </section>
    <hr class="content-divider">
    <section class="recipe-section grocery-add-weekly-panel">
        <form hx-post="{{ base_path }}/week-menu/grocery-list/add-weekly" hx-target="#grocery-list-body"
            hx-swap="outerHTML show:none" class="grocery-add-weekly-form">
            <button type="submit" class="btn btn-secondary btn-action">
                <span class="btn-action-icon" aria-hidden="true">📋</span>
                <span>{{ t('grocery.action.add_weekly_groceries') }}</span>
            </button>
        </form>
    </section>
    <hr class="content-divider">
</div>
