<form hx-post="{{ base_path }}/recipes/edit-servings/{{ recipe.id }}" hx-target="#recipe-servings" hx-swap="innerHTML" class="inline-form">
    <div class="form-group form-group--inline">
        <input type="number" name="new_servings" value="{{ recipe.servings }}" class="form-control recipe-servings-input" min="1" required autofocus />
        <button type="submit" class="btn btn-primary btn-sm">{{ t('recipe.edit.action.save_servings') }}</button>
    </div>
</form>
